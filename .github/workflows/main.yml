name: Quarto render and publish

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # allows running this manually from the Actions tab

permissions:
  contents: write
  pages: write

# Never run two deployments at once; a newer push supersedes an older one.
concurrency:
  group: pages
  cancel-in-progress: true

# The website pages (index.qmd, others/*.qmd) contain no executable code:
# exercises and slides in handouts/ and slides/ are committed pre-rendered.
# So only Quarto is needed here. If you ever add a page with R chunks to the
# render list, add `r-lib/actions/setup-r@v2` and `r-lib/actions/setup-renv@v2`
# steps before "Render and publish".

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render and publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
